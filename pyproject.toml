[project]
name = "worm"
version = "0.1.0"
description = "A small, polite web crawler CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sreeniketh Aathreya Pradeep Kumar" }]
keywords = ["crawler", "spider", "cli", "http"]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
worm = "worm.cli:main"

[project.urls]
Homepage = "https://github.com/daedalus-s/worm"
Repository = "https://github.com/daedalus-s/worm"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worm"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["worm"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
